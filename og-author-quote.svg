<defs>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#030910" stop-opacity=".94"/><stop offset=".56" stop-color="#030910" stop-opacity=".65"/><stop offset="1" stop-color="#030910" stop-opacity=".05"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#80522c"/><stop offset=".48" stop-color="#f2c27a"/><stop offset="1" stop-color="#80522c"/></linearGradient>
