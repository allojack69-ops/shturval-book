<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book download</title>
<style>
body{margin:0;min-height:100vh;background:#040608;color:#f4f5f6;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}
main{width:min(620px,calc(100% - 44px));text-align:center;padding:40px 0}
h1{font-size:clamp(34px,8vw,58px);letter-spacing:-.04em;margin:0 0 18px}
p{color:#9aa4ad;line-height:1.7}
.contour-message{margin:30px auto 0;padding:22px 24px;border:1px solid #202930;background:#080d11;color:#d9dee2;line-height:1.7}
.contour-message strong{display:block;color:#f4f5f6;margin-bottom:8px}
a{display:inline-flex;margin-top:20px;padding:15px 22px;background:#e32229;color:#fff;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#status{margin-top:22px}
</style>
</head>
<body>
<main>
  <div id="brand">ШТУРВАЛ</div>
  <h1 id="heading">Дякую за покупку.</h1>
  <p id="status">Перевіряємо оплату та готуємо EPUB…</p>
  <div class="contour-message">
    <strong>CONTOUR</strong>
    Contour пропонує вам зберегти код SMA0.<br>
    Подальша взаємодія збільшить шанси на позитивні зміни на 33%.
  </div>
  <a id="download" href="#" hidden>Завантажити EPUB</a>
</main>
<script>
(async () => {
  const status = document.getElementById("status");
  const button = document.getElementById("download");
  const params = new URLSearchParams(location.search);
  const transactionId = params.get("transaction_id");
  const lang = params.get("lang") === "en" ? "en" : "uk";
  if (lang === "en") {
    document.documentElement.lang = "en";
    document.title = "THE HELM — download";
    document.getElementById("brand").textContent = "THE HELM";
    document.getElementById("heading").textContent = "Thank you for your purchase.";
    status.textContent = "Verifying your payment and preparing the EPUB…";
    button.textContent = "Download EPUB";
  }

  if (!transactionId) {
    status.textContent = "Не знайдено номер транзакції.";
    return;
  }

  try {
    const response = await fetch(
      "/download-epub?lang=" + lang + "&transaction_id=" + encodeURIComponent(transactionId),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    button.href = url;
    button.download = lang === "en" ? "THE_HELM_English.epub" : "SHTURVAL_Ukrainian.epub";
    button.hidden = false;
    status.textContent = lang === "en" ? "Payment confirmed. EPUB download started." : "Оплату підтверджено. Завантаження EPUB розпочато.";

    // Автоматично запускаємо завантаження. Сторінка при цьому залишається відкритою,
    // а кнопка лишається доступною, якщо браузер заблокує автоматичний запуск.
    button.click();

    button.addEventListener("click", () => {
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });
  } catch (error) {
    console.error(error);
    status.textContent = lang === "en" ? "Could not prepare the file. Refresh the page or contact the author." : "Не вдалося підготувати файл. Спробуй оновити сторінку або звернися до автора.";
  }
})();
</script>
</body>
</html>
